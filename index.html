<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BUBBLEBEE | Luxury B&B</title>
  <style>
    :root{
      --bg:#050505; --text:#f5f5f5; --muted:#b3b3b3; --accent:#d4a94f;
      --radius:16px; --pill:999px; --maxw:1100px; --shadow:0 18px 45px rgba(0,0,0,0.55);
      --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%; width:100%; overflow-x:hidden;}
    body{
      font-family:var(--font);
      background:#050505;
      color:var(--text); -webkit-font-smoothing:antialiased;
    }
    a{color:inherit;text-decoration:none}
    .shell{max-width:var(--maxw);margin:0 auto;padding:14px}

    /* HEADER */
    header{
      position:sticky;top:0;z-index:100;
      background:rgba(5,5,5,0.8);backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(255,255,255,0.05);
    }
    .header-inner{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
    .brand{display:flex;align-items:center;gap:10px}
    .brand-logo img{display:block; max-height:42px; width:auto; object-fit:contain;}
    
    .nav-toggle{display:flex;align-items:center;gap:12px}
    .hamburger{
      width:44px;height:44px;border-radius:12px;
      background:var(--accent); color:#000;
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;font-size:22px;border:none;font-weight:bold;
    }
    .btn-primary{
      background:linear-gradient(135deg,#f7e3a8,#d4a94f);color:#1a1205;border:none;padding:10px 18px;border-radius:999px;font-weight:700;
      cursor:pointer;font-size:0.85rem;text-transform:uppercase;letter-spacing:1px;
    }

    /* NUOVO MENU A GRIGLIA (Full Screen) */
    .nav-panel{
      position:fixed; inset:0; z-index:1000;
      background:rgba(5,5,5,0.98); backdrop-filter:blur(20px);
      display:flex; flex-direction:column; justify-content:center;
      opacity:0; pointer-events:none; transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      padding:20px;
    }
    .nav-panel.open{opacity:1; pointer-events:auto;}

    .nav-grid {
      display:grid; 
      grid-template-columns: repeat(2, 1fr); /* 2 Colonne affiancate */
      gap: 12px; 
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
    }

    .nav-panel a {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(212,169,79,0.2);
      border-radius: 15px;
      padding: 20px 10px;
      text-align: center;
      font-weight: 600;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1 / 0.8; /* Rende i pulsanti quasi quadrati */
      transition: all 0.2s ease;
    }

    .nav-panel a:active {
      background: var(--accent);
      color: #000;
    }

    /* Pulsante Chiudi nel Menu */
    .close-menu {
      position: absolute; top: 20px; right: 20px;
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.1); color: var(--text);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; cursor: pointer; border: none;
    }

    /* HERO & CONTENT */
    .hero{padding:20px 0; display:flex; flex-direction:column; gap:20px;}
    .hero-title{font-size:2rem; line-height:1.1; text-transform:uppercase;}
    .accent{color:var(--accent)}
    .carousel{border-radius:20px; overflow:hidden; height:250px; position:relative; background:#111;}
    .slide{position:absolute; inset:0; background-size:cover; background-position:center; opacity:0; transition:0.6s;}
    .slide.active{opacity:1;}
    
    .cards-grid{display:grid; grid-template-columns:1fr; gap:15px; margin-top:20px;}
    .card{background:rgba(255,255,255,0.03); border-radius:15px; padding:15px; border:1px solid rgba(255,255,255,0.05);}
    .card img{width:100%; height:180px; object-fit:cover; border-radius:10px; margin-bottom:10px;}

    /* Desktop Adjustments */
    @media(min-width:768px){
      .nav-grid { grid-template-columns: repeat(4, 1fr); max-width: 800px; }
      .hero{flex-direction:row; align-items:center;}
      .hero-left, .carousel{flex:1;}
      .cards-grid{grid-template-columns:1fr 1fr;}
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner shell">
      <div class="brand">
        <div class="brand-logo"><img src="logo1.JPG" alt="Logo"></div>
      </div>
      <div class="nav-toggle">
        <button class="btn-primary" onclick="scrollToSection('contatti')">Prenota</button>
        <button class="hamburger" id="hamburger">☰</button>
      </div>
    </div>

    <nav class="nav-panel" id="navPanel">
      <button class="close-menu" id="closeMenu">&times;</button>
      <div class="nav-grid">
        <a href="#suite" onclick="toggleNav()">Suite</a>
        <a href="#bubble" onclick="toggleNav()">Bubble</a>
        <a href="#esperienze" onclick="toggleNav()">Esperienze</a>
        <a href="#territorio" onclick="toggleNav()">Territorio</a>
        <a href="#bottega" onclick="toggleNav()">Bottega</a>
        <a href="#sala-eventi" onclick="toggleNav()">Eventi</a>
        <a href="#contatti" onclick="toggleNav()" style="grid-column: span 2; aspect-ratio: auto; padding: 15px; background: rgba(212,169,79,0.1);">Contatti</a>
      </div>
    </nav>
  </header>

  <main class="shell">
    <section class="hero">
      <div class="hero-left">
        <h1 class="hero-title">Rifugio di <span class="accent">lusso silenzioso</span></h1>
        <p style="color:var(--muted); margin:15px 0;">Suite di design e Bubble Rooms sotto le stelle d'Abruzzo.</p>
        <button class="btn-primary" onclick="scrollToSection('suite')">Scopri di più</button>
      </div>
      <div class="carousel" id="heroCarousel">
        <div class="slide active" style="background-image:url('tenuta bubblebee.jpeg');"></div>
        <div class="slide" style="background-image:url('vista tenuta.jpeg');"></div>
      </div>
    </section>

    <section id="suite">
      <h2 style="text-transform:uppercase; margin-bottom:15px; font-size:1.2rem;">Le Suite</h2>
      <div class="cards-grid">
        <div class="card">
          <img src="https://images.pexels.com/photos/271624/pexels-photo-271624.jpeg?auto=compress&cs=tinysrgb&w=1200">
          <p><strong>Suite Aurea</strong></p>
        </div>
        <div class="card">
          <img src="https://images.pexels.com/photos/271618/pexels-photo-271618.jpeg?auto=compress&cs=tinysrgb&w=1200">
          <p><strong>Suite Terra</strong></p>
        </div>
      </div>
    </section>
  </main>

  <script>
    const hamburger = document.getElementById('hamburger');
    const closeMenu = document.getElementById('closeMenu');
    const navPanel = document.getElementById('navPanel');

    function toggleNav() {
      navPanel.classList.toggle('open');
    }

    hamburger.addEventListener('click', toggleNav);
    closeMenu.addEventListener('click', toggleNav);

    function scrollToSection(id) {
      if(navPanel.classList.contains('open')) toggleNav();
      const el = document.getElementById(id);
      if(el) el.scrollIntoView({behavior:'smooth'});
    }

    // Carousel semplice
    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide');
    setInterval(() => {
      slides[currentSlide].classList.remove('active');
      currentSlide = (currentSlide + 1) % slides.length;
      slides[currentSlide].classList.add('active');
    }, 4000);
  </script>
</body>
</html>
